services:
  - type: web
    name: star-square
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "1"
      - key: STORAGE_GATEWAY_URL
        sync: false
      - key: STORAGE_GATEWAY_TOKEN
        sync: false
      - key: GEOIP_LOOKUP
        value: "1"
      - key: TRUST_PROXY_HOPS
        value: "1"
